[package]
name = "kaggle-tpu-companion"
version = "0.4.5"
description = "Windows companion for kaggle-tpu-lab Qwen3.8-27B and GLM-5.3-Flash TPU sessions"
authors = ["lucastq"]
edition = "2021"

[lib]
name = "kaggle_tpu_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
thiserror = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
# O padrao (debug = 2) gerava sozinho ~1.5 GB de .pdb mais rlibs gigantes no target/debug.
# "line-tables-only" mantem backtraces com numeros de linha e corta a maior parte do peso.
debug = "line-tables-only"
# Descomente se o cache incremental (~1 GB) incomodar mais que a velocidade de rebuild:
# incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
