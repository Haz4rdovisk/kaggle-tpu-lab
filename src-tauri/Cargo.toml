[package]
name = "kaggle-tpu-companion"
version = "0.1.0"
description = "Windows companion for the kaggle-tpu-lab Qwen3.8-27B TPU session"
authors = ["lucastq"]
edition = "2021"

[lib]
name = "kaggle_tpu_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
